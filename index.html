<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <title>فتح صفحة محلياً</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; font-family: sans-serif; }
    #controls { padding: 12px; background: #f5f5f5; border-bottom: 1px solid #ddd; }
    #urlInput { width: 60%; padding: 8px; font-size: 1rem; }
    #loadBtn { padding: 8px 12px; font-size: 1rem; }
    #frameWrap { height: calc(100% - 60px); }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
  </head>
  <body>
  <div id="controls">
    <form id="urlForm" onsubmit="loadUrl(event)" autocomplete="off">
      <input id="urlInput" type="text" placeholder="https://example.com" />
      <button id="loadBtn" type="submit">فتح</button>
    </form>
  </div>
  <div id="frameWrap">
    <iframe id="pageFrame" src="about:blank" title="الموقع المفتوح محلياً"></iframe>
  </div>

  <script>
    function loadUrl(e) {
      e.preventDefault();
      const val = document.getElementById('urlInput').value.trim();
      if (!val) return;
      // Ensure protocol is present
      let url = val;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      document.getElementById('pageFrame').src = url;
    }
  </script>
  </body>
  </html>
